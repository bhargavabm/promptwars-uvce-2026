<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Bankism</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Bankism — AI Banking Firewall</h1>
      <p class="subtitle">Sign in to access the firewall console.</p>
    </header>

    <section class="card">
      {% if error %}
      <p class="auth-error" role="alert">{{ error }}</p>
      {% endif %}

      <form method="post" action="/login" class="auth-form" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

        <label class="label" for="username">Username</label>
        <input class="input" id="username" name="username" type="text" required autofocus />

        <label class="label" for="password">Password</label>
        <input class="input" id="password" name="password" type="password" required />

        <div class="actions">
          <button class="btn btn-primary" type="submit">Sign in</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
